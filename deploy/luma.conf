# nginx route for Luma calendar — install to the agentlab-nginx routes dir:
#   /home/ubuntu/agentlab/services/nginx/routes/luma.conf
# then: docker exec agentlab-nginx nginx -t && docker exec agentlab-nginx nginx -s reload
location = /luma {
    return 302 /luma/;
}

location /luma/ {
    client_max_body_size 16m;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;

    auth_request /internal/authelia/authz;
    auth_request_set $user $upstream_http_remote_user;
    auth_request_set $groups $upstream_http_remote_groups;
    auth_request_set $name $upstream_http_remote_name;
    auth_request_set $email $upstream_http_remote_email;
    auth_request_set $redirection_url $upstream_http_location;
    error_page 401 =302 $redirection_url;

    proxy_set_header Remote-User $user;
    proxy_set_header X-Forwarded-User $user;

    rewrite ^/luma/?(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8771;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Prefix /luma;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}
